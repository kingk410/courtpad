<style>
  :root {
    --bg: #101418;
    --panel: #1a2027;
    --panel2: #232b34;
    --line: #2e3a45;
    --text: #e8edf2;
    --dim: #8b98a5;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --teamA: #3b82f6;
    --teamB: #f97316;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro", Helvetica, Arial, sans-serif;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .scoreline { display: flex; align-items: baseline; gap: 8px; font-weight: 700; }
  .scoreline .team { font-size: 15px; letter-spacing: .5px; }
  .scoreline .pts { font-size: 26px; font-variant-numeric: tabular-nums; }
  .scoreline .dash { color: var(--dim); font-size: 18px; }
  .qchip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-weight: 700; font-size: 15px;
  }
  .spacer { flex: 1; }
  .syncdot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
  .syncdot.green { background: var(--green); }
  .syncdot.amber { background: var(--amber); }
  .syncdot.red { background: var(--red); }
  .topbtn {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-weight: 600; font-size: 14px;
  }
  .topbtn.undo { background: #3a2530; border-color: #5c3a4a; }

  /* ---------- game layout ---------- */
  .gamebody { flex: 1; display: flex; min-height: 0; }
  .teamcol {
    flex: 0 0 24%; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; overflow-y: auto; background: var(--panel);
  }
  .teamcol.right { border-left: 1px solid var(--line); }
  .teamcol.left { border-right: 1px solid var(--line); }
  .teamcol h3 {
    margin: 0 0 2px; font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between;
    align-items: center;
  }
  .subbtn {
    font-size: 11px; padding: 4px 10px; border-radius: 6px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  }
  .subbtn.arming { background: var(--amber); color: #000; }
  .benchlabel { font-size: 10px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 1px; margin: 6px 0 0; text-align: center; }
  .pbtn {
    display: flex; align-items: center; gap: 8px;
    min-height: 52px; padding: 6px 10px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--line);
    text-align: left;
  }
  .pbtn .num { font-size: 19px; font-weight: 800; min-width: 30px; font-variant-numeric: tabular-nums; }
  .pbtn .pname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbtn .fouls { font-size: 10px; letter-spacing: 1px; }
  .pbtn .fouls.warn { color: var(--amber); }
  .pbtn .fouls.danger { color: var(--red); }
  .pbtn.selected { outline: 3px solid var(--accent); background: #1e3a5f; }
  .pbtn.subtarget { outline: 2px dashed var(--amber); }
  .teamA .pbtn.selected { outline-color: var(--teamA); }
  .teamB .pbtn.selected { outline-color: var(--teamB); }

  .actioncol { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; min-width: 0; }
  .selline { min-height: 24px; font-size: 14px; color: var(--dim); text-align: center; }
  .selline b { color: var(--text); font-size: 16px; }
  .actiongrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .abtn {
    min-height: 58px; border-radius: 12px; font-size: 17px; font-weight: 700;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .abtn:active { transform: scale(.97); }
  .abtn.make { background: #14351f; border-color: #1f5e33; }
  .abtn.miss { background: #38201d; border-color: #6e2f28; }
  .abtn.small { font-size: 15px; min-height: 52px; }
  .abtn:disabled { opacity: .35; }
  .togglerow { display: flex; gap: 8px; }
  .tbtn {
    flex: 1; min-height: 44px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  }
  .tbtn.on { background: var(--amber); color: #000; border-color: var(--amber); }

  .followup {
    background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
    padding: 10px; display: none; flex-direction: column; gap: 8px;
  }
  .followup.visible { display: flex; }
  .followup .fq { font-size: 14px; font-weight: 700; }
  .fopts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fbtn {
    min-height: 48px; min-width: 64px; padding: 0 12px; border-radius: 10px;
    font-size: 16px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line);
  }
  .fbtn.dismiss { color: var(--dim); font-weight: 600; }

  .ticker {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line);
    font-size: 13px; color: var(--dim); overflow: hidden; white-space: nowrap;
  }
  .ticker .events { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .ticker .events b { color: var(--text); }

  /* ---------- court modal ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal.visible { display: flex; }
  .modalbox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px; max-width: 92vw;
    max-height: 92vh;
  }
  .modalbox h4 { margin: 0; font-size: 15px; }
  .courtwrap svg { display: block; border-radius: 8px; }
  .modalrow { display: flex; gap: 8px; justify-content: flex-end; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: #000c; border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 16px; font-size: 14px; display: none;
    z-index: 60; align-items: center; gap: 12px;
  }
  #toast.visible { display: flex; }
  #toast button { background: var(--accent); border-radius: 8px; padding: 6px 12px; font-weight: 700; }

  /* ---------- home & setup ---------- */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 20px; overflow-y: auto; }
  .homecard {
    width: min(520px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .homecard h1 { margin: 0; font-size: 24px; }
  .homecard h2 { margin: 8px 0 0; font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .bigbtn {
    min-height: 54px; border-radius: 12px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #fff;
  }
  .bigbtn.secondary { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  .gamerow {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 15px;
  }
  .muted { color: var(--dim); font-size: 12px; }

  .setupwrap { flex: 1; overflow-y: auto; padding: 16px; -webkit-user-select: text; user-select: text; }
  .setupgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 980px; margin: 0 auto; }
  .setupcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; }
  .setupcard.full { grid-column: 1 / -1; }
  .setupcard label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .setupcard input[type=text], .setupcard input[type=number], .setupcard textarea, .setupcard select {
    font: inherit; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100%;
  }
  .setupcard textarea { min-height: 150px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 700;
    background: var(--panel2); border: 1px solid var(--line);
  }
  .chip.on { background: var(--green); color: #05230f; border-color: var(--green); }
  .radio { display: flex; align-items: center; gap: 8px; font-size: 14px; }

  /* ---------- event log screen ---------- */
  .logwrap { flex: 1; overflow-y: auto; padding: 12px; }
  .logrow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); font-size: 15px;
  }
  .logrow .lq { color: var(--dim); font-size: 12px; min-width: 30px; }
  .logrow .ltext { flex: 1; }
  .logrow .del {
    background: #3a2530; border: 1px solid #5c3a4a; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 700; color: #ff9aa2;
  }

  /* ---------- test harness ---------- */
  .harness { padding: 20px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .harness .pass { color: var(--green); }
  .harness .fail { color: var(--red); }
  .harness .known { color: var(--amber); }
  .harness h2 { font-family: -apple-system, sans-serif; }
</style>
