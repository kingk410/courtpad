<script>
/**
 * SetupUI — the new-game wizard. Rosters are pasted/typed as "number name"
 * lines; starters are tapped as chips; saved rosters prefill via the server.
 */
var SetupUI = (function () {
  'use strict';

  var starters = [[], []]; // selected starter nums per team panel
  var savedRosters = [];

  function $(id) { return document.getElementById(id); }
  function panel(i) { return $('su-team' + i); }
  function field(i, cls) { return panel(i).querySelector('.' + cls); }

  function parseRoster(text) {
    var out = [];
    String(text || '').split('\n').forEach(function (line) {
      var m = line.trim().match(/^(\d+)\s+(.*)$/) || line.trim().match(/^(\d+)$/);
      if (m) out.push({ num: m[1], name: (m[2] || '').trim() });
    });
    return out;
  }

  function renderStarters(i) {
    var roster = parseRoster(field(i, 'su-roster').value);
    var el = field(i, 'su-starters');
    var html = '';
    roster.forEach(function (p) {
      var on = starters[i].indexOf(p.num) !== -1;
      html += '<button class="chip' + (on ? ' on' : '') + '" data-num="' + p.num + '">' +
        p.num + (p.name ? ' ' + p.name.split(' ')[0] : '') + '</button>';
    });
    el.innerHTML = html || '<span class="muted">Enter the roster above first.</span>';
  }

  function wirePanel(i) {
    field(i, 'su-roster').addEventListener('input', function () {
      starters[i] = starters[i].filter(function (n) {
        return parseRoster(field(i, 'su-roster').value).some(function (p) { return p.num === n; });
      });
      renderStarters(i);
    });
    field(i, 'su-starters').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      var num = chip.dataset.num;
      var idx = starters[i].indexOf(num);
      if (idx !== -1) starters[i].splice(idx, 1);
      else if (starters[i].length < 5) starters[i].push(num);
      renderStarters(i);
    });
    field(i, 'su-name').addEventListener('input', function () {
      var code = field(i, 'su-code');
      if (!code.value && this.value) code.value = this.value.trim().charAt(0).toLowerCase();
    });
    field(i, 'su-saved').addEventListener('change', function () {
      var r = savedRosters[Number(this.value)];
      if (!r) return;
      field(i, 'su-name').value = r.name;
      field(i, 'su-code').value = r.code || r.name.charAt(0).toLowerCase();
      field(i, 'su-roster').value = r.roster.map(function (p) {
        return p.num + (p.name ? ' ' + p.name : '');
      }).join('\n');
      starters[i] = (r.starters || []).map(String);
      renderStarters(i);
    });
  }

  var wired = false;
  function open() {
    if (!wired) { wirePanel(0); wirePanel(1); wired = true; }
    starters = [
      starters[0] || [],
      starters[1] || []
    ];
    renderStarters(0);
    renderStarters(1);
    $('su-status').textContent = '';

    var lastSs = Sync.getPref('lastSsName', null);
    $('su-ss-last-label').textContent = lastSs
      ? 'Same spreadsheet as last game (' + lastSs + ')'
      : 'Same spreadsheet as last game';
    if (!Sync.getPref('lastSsId', null)) {
      $('su-ss-new').checked = true;
    }

    Sync.call('api_getRosters').then(function (rosters) {
      savedRosters = rosters || [];
      [0, 1].forEach(function (i) {
        var sel = field(i, 'su-saved');
        var html = '<option value="">Saved…</option>';
        savedRosters.forEach(function (r, ri) {
          html += '<option value="' + ri + '">' + r.name + '</option>';
        });
        sel.innerHTML = html;
      });
    }).catch(function () { /* offline dev — fine */ });

    document.querySelectorAll('.screen').forEach
      ? document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); })
      : null;
    $('screen-setup').classList.add('active');
  }

  function validate() {
    var tabName = $('su-tabname').value.trim();
    if (!tabName) return 'Enter a game name.';
    for (var i = 0; i < 2; i++) {
      if (!field(i, 'su-name').value.trim()) return 'Enter both team names.';
      if (!field(i, 'su-code').value.trim()) return 'Enter both team codes.';
      if (parseRoster(field(i, 'su-roster').value).length < 5) {
        return field(i, 'su-name').value + ': need at least 5 players.';
      }
      if (starters[i].length !== 5) {
        return field(i, 'su-name').value + ': tap exactly 5 starters (' +
          starters[i].length + ' selected).';
      }
    }
    var c0 = field(0, 'su-code').value.trim().toLowerCase();
    var c1 = field(1, 'su-code').value.trim().toLowerCase();
    if (c0 === c1) return 'Team codes must differ.';
    return null;
  }

  function create(onCreated) {
    var err = validate();
    if (err) { $('su-status').textContent = '⚠️ ' + err; return; }

    var setup = {
      tabName: $('su-tabname').value.trim(),
      quarterMinutes: Number($('su-qmin').value) || 8,
      plays: App.getPlays(), // reserves the PLAY STATS block on the sheet
      teams: [0, 1].map(function (i) {
        return {
          code: field(i, 'su-code').value.trim().toLowerCase(),
          name: field(i, 'su-name').value.trim(),
          roster: parseRoster(field(i, 'su-roster').value),
          starters: starters[i].slice()
        };
      })
    };
    var req = { setup: setup };
    if ($('su-ss-last').checked && Sync.getPref('lastSsId', null)) {
      req.spreadsheetId = Sync.getPref('lastSsId', null);
    } else {
      req.spreadsheetName = $('su-ssname').value.trim() || 'Basketball Gamelog';
    }

    $('su-status').textContent = 'Creating game (painting the spreadsheet)…';
    $('setup-create').disabled = true;
    Sync.call('api_setupGame', req).then(function (rec) {
      $('setup-create').disabled = false;
      Sync.setPref('lastSsId', rec.ssId);
      Sync.setPref('lastSsName', rec.tabName);
      onCreated({
        gameId: rec.gameId,
        rec: rec,
        setup: rec.setup,
        events: [],
        revision: 0,
        trackShots: true
      });
    }).catch(function (e) {
      $('setup-create').disabled = false;
      $('su-status').textContent = '⚠️ Create failed: ' + e;
    });
  }

  return { open: open, create: create };
})();
</script>
